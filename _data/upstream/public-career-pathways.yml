      - A reporting or compliance workflow restructured so risks surface earlier and cleaner
      - An onboarding or intake process rebuilt and adopted across the function
      - A cross-function coordination effort owned end-to-end through real ambiguity
    - level: Senior
      decisions_ownership: Makes consequential operational tradeoffs; owns an operations area or capability the company depends on
      consulting_scope: Reframes operational problems into clear choices for leadership; aligns internal stakeholders on operational change
      impact: Operations are measurably more reliable or efficient because of decisions they made
      calibration_question: Would operational quality or reliability slip if they stepped away?
      mission: Own an operations area or capability the company depends on.
      success_looks_like:
      - Sets the approach for an operations area or capability and makes the consequential tradeoff calls under real constraints
      - Aligns internal stakeholders on operational change and keeps it moving
      - Reframes messy operational situations into clear choices for leadership
      - Improves operational reliability or efficiency through decisions they made, not just work they delivered
      - Mentors Coordinators and junior practitioners through review, pairing, and direct coaching
      - Strengthens the area's operational judgment alongside their own work — QA standards, escalation habits, documentation practice
      example_outcomes:
      - An operations area run measurably more reliably or efficiently because of decisions they made
      - An operational standard or system the area adopted that caught problems earlier
      - A consequential tradeoff — what to automate, what to standardize, what to retire — that held up under pressure
      - A junior practitioner who grew measurably under their mentorship into independent ownership
    - level: Staff
      decisions_ownership: Sets operational direction across functions; owns operational standards, systems, or process strategy
      consulting_scope: Gets functions pulling in the same direction on operational change; resolves organizational blockers no single function can clear
      impact: Multiple functions run better because of the operations systems or standards they put in place
      calibration_question: Would cross-function operational quality or standards slip if they stepped away?
      mission: Set operational direction across functions.
      success_looks_like:
      - Sets operational direction across functions — not just within one area
      - Establishes operational standards, systems, or process strategy adopted across functions
      - Identifies systemic operational gaps no single function would see and addresses them
      - Resolves cross-function operational tradeoffs and blockers no single function can clear
      - Influences company-level operational strategy with leadership
      - Mentors operations practitioners across functions and grows Seniors into cross-function thinking
      example_outcomes:
      - An operational standard or system adopted across multiple functions that reduced duplicate work or errors
      - A process-strategy change that smoothed how work moves across finance, contracts, people ops, and delivery
      - A systemic operational gap surfaced and closed that no single function had owned
      - A cross-function operational conflict resolved, unblocking stalled work and restoring momentum
    - level: Principal
      decisions_ownership: Reframes how Skylight operates at the company level, diagnosing root causes with leadership; shares ownership of Skylight's operational health and growth
      consulting_scope: Trusted authority on company operations; aligns leadership around operational direction and earns their buy-in
      impact: How the company operates is materially better because of their direction, and Skylight is stronger for it
      calibration_question: Would Skylight's operating model be on a different path if they hadn't been here?
      mission: Reframe how Skylight operates at the company level.
      success_looks_like:
      - Reframes how Skylight operates at the company level, diagnosing root causes rather than treating symptoms
      - Shapes the company's operating model and operational direction
      - Aligns leadership around operational strategy and earns their buy-in
      - Guides major operational tradeoffs across the company — what to centralize, standardize, invest in, or retire
      - Contributes to Skylight's Operations practice area through hiring, leveling, craft standards, and developing Staff-level practitioners
      - Contributes to Skylight's growth and health by helping operations scale to support new work or expanded capacity
      example_outcomes:
      - An operating-model change adopted across the company that materially improved how it runs
      - An operational strategy that let Skylight scale capacity or take on new work without proportional friction
      - A company-wide operational standard or career framework adopted across the Operations practice area
      - Leadership adopting a different operational direction because of a Principal-led diagnosis
  - id: internal-systems-and-enablement
    name: Internal Systems & Enablement
    pathway_status: ported
    role_count: 6
    public_headline: Find out how we design and automate the systems Skylight runs on, and the skills you need at each level.
    mission: Internal Systems & Enablement practitioners design, document, and automate the internal systems, workflows, and content Skylight runs on. They turn operational needs into clear, reliable ways of working that people adopt. They make sure the systems that result get used, make work simpler across functions, and let the company operate efficiently as it grows.
    applies_levels:
    - Associate
    - I
    - II
    - Senior
    - Staff
    - Principal
    core_craft:
    - area: Systems mapping and design
      description: Mapping how internal systems work — across people, process, tooling, data, and governance — and designing better workflows that can scale, with explicit decision rights, handoffs, and escalation paths
    - area: Operational content and documentation
      description: Turning complex workflows, policies, and system changes into clear, usable content — standard operating procedures (SOPs), guides, templates, and reusable assets — with strong version control, consistent terminology, and findable structure
    - area: Operations automation and tooling
      description: Building reliable automation and internal tooling — scripts, integrations, APIs, AI-assisted workflows — that work with existing systems and respect which system holds the official record
    - area: Governance and decision-making
      description: Establishing the standards, change-control discipline, and decision rights that keep internal systems consistent — who decides what, what information they need, and how issues are escalated
    - area: Adoption and measurable impact
      description: Making sure redesigned systems are used and showing the improvement they make — running rollouts, feedback loops, and the measures that show friction and rework went down
    levels:
    - level: Associate
      decisions_ownership: Executes defined internal-systems, content, or automation tasks with guidance from more experienced practitioners
      consulting_scope: Responds to internal-stakeholder requests with guidance; contributes to shared operational documentation
      impact: Their assigned internal-systems work is done reliably, with little rework
      calibration_question: Can they deliver defined internal-systems tasks reliably, with guidance?
      mission: Develop foundational internal-systems, content, or automation skills while supporting the function reliably.
      success_looks_like:
      - Completes well-scoped systems, documentation, or automation tasks with guidance
      - Produces clear operational documentation that follows existing patterns and terminology
      - Implements feedback without repeated rework
      - Collaborates effectively with internal stakeholders and asks for help at the right moments
      - Learns the team's practices for governance, official records, and adoption
      example_outcomes:
      - An SOP or template drafted from an existing pattern and adopted without major revision
      - A scoped workflow change mapped and documented cleanly
      - A small automation or integration built under guidance and validated before deployment
      - A terminology or version-control cleanup that reduced confusion in an internal doc set
    - level: I
      decisions_ownership: Decides approach for well-scoped internal-systems work; owns a defined workflow, content area, or automation within a larger effort
      consulting_scope: Builds solid working relationships with direct internal counterparts; communicates changes and progress clearly
      impact: The internal-systems work they own is done well and on pace
      calibration_question: Can they be trusted to own a well-scoped internal-systems area without close oversight?
      mission: Own a well-scoped internal workflow, content area, or automation, deciding the approach within a larger effort.
      success_looks_like:
      - Owns a defined piece of internal-systems work — a workflow, a content area, an automation — end-to-end within a larger effort
      - Decides the approach for well-scoped work and delivers what they own well and on pace
      - Produces operational documentation with clean structure, version control, and consistent terminology without being prompted
