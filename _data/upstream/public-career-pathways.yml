      consulting_scope: Gets teams across engagements and agency stakeholder groups pulling in the same direction; clears organizational blockers no single team can clear; influences program-level acquisition strategy with client leadership across more than one program area
      impact: The whole operating context runs better because of what they put in place, and it travels to other engagements and clients — who buy more effectively because of their playbooks and direction
