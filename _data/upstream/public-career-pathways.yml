      - Establishes operating models, prioritization frameworks, or standards that other teams adopt
      - Resolves cross-team tradeoffs and organizational blockers
      - Influences program-level strategy with client and Skylight leadership
      - Mentors product managers across teams and strengthens cross-team product decision-making
      - Maintains cross-team alignment on outcomes when delivery pressure, shifting priorities, or organizational friction threaten it
      example_outcomes:
      - A product operating model adopted by multiple workstreams on a large engagement
      - A shared prioritization framework that made cross-team roadmap decisions consistent
      - A cross-team discovery effort that revealed a shared barrier and redirected several roadmaps
      - A cross-team prioritization conflict resolved, unblocking stalled delivery and restoring momentum
      - A reusable roadmap or intake process that other product managers adopted across the portfolio
      - A product manager who developed cross-team product thinking after sustained coaching and mentorship
    - level: Principal
      decisions_ownership: Decides, with client leadership, what the product should accomplish for part of the mission, cutting through the noise to diagnose the root problem; shares ownership of Skylight's own health and growth
      consulting_scope: A trusted advisor to client leadership on product strategy who aligns stakeholders on the solution and earns their buy-in; a recognized voice in their field
      impact: The client adopts a different approach to part of its mission because of their work, and Skylight is stronger for it
      calibration_question: If they'd never been here, would the client's approach to its mission — or Skylight's growth trajectory — be on a different path?
      mission: Shape product strategy across portfolios or mission areas.
      success_looks_like:
      - Reframes problems and influences how the client thinks about part of its mission
      - Serves as a trusted product authority for client leadership and externally
      - Identifies major opportunities to improve mission outcomes through product strategy
      - Aligns client leadership around product outcomes and direction
      - Guides major product tradeoffs across programs
      - Contributes to Skylight's Product Management practice area through hiring, leveling, and craft standards
      - Contributes to Skylight's growth through proposals, expanded scope with existing clients, or bringing in new opportunities
      example_outcomes:
      - An agency program reorganized around a Principal's reframing of what the product should achieve
      - A product operating model adopted across a portfolio that changed how multiple programs prioritize
      - A winning proposal contribution or a new contract opened with an existing client
      - Client leadership adopting a different approach to a mission outcome — for example, sequencing a phased rollout instead of a single launch — based on a Principal-led product strategy
      - A Skylight-wide product craft standard, or a body of external work such as writing and speaking, that builds the practice area's reputation and pipeline
  - id: delivery-management
    name: Delivery Management
    pathway_status: ported
    role_count: 2
    public_headline: Find out how we keep client work on track and delivered well, and the skills you need at each level.
    mission: 'Delivery Management practitioners make sure Skylight''s client work gets delivered, and delivered well. They sit at the interface between the delivery team and the client: running the engagement with modern, flexible, agile practices, keeping it healthy and on track, and clearing the path so the team can do its best work. At the senior end they lead the engagement, manage the client relationship day to day, and own compliant delivery under the contract; at earlier levels they keep delivery visible and coordinated. Either way, well-run delivery is what turns the team''s work into a public service that works better for the people who rely on it.'
    applies_levels:
    - Associate
    - I
    - II
    - Senior
    - Staff
    - Principal
    core_craft:
    - area: Delivery orchestration and operations
      description: Running delivery with a modern, flexible, agile approach and keeping execution visible — milestones, dependencies, blockers, risks, decisions, and follow-through that stay current and useful for decisions, not rigid process for its own sake
    - area: Outcome and value realization
      description: Connecting delivery work to the outcomes the client and the public actually feel, not just activity or milestones
    - area: Scope, risk, and expectation management
      description: Managing scope, time, and capacity tradeoffs; surfacing risk early with context and options; resetting expectations before commitments slip
    - area: Stakeholder leadership and client trust
      description: Acting as the interface to the client — building durable trust with senior stakeholders and supporting client-facing coordination with maturity in regulated environments
    - area: Team health and sustainability
      description: Building teams that are iterative, collaborative, and transparent; creating alignment on the goal and direction so the team can self-organize with real autonomy (there's no autonomy without alignment); leading by enabling and coaching rather than imposing how the work gets done; defining what healthy delivery looks like and protecting sustainability while keeping client trust under stress
    - area: Contract and staffing stewardship
      description: Staffing the engagement with the right roles and capacity, handling transitions with continuity, and keeping the team compliant with the contract's terms and applicable security, privacy, and procurement rules
    - area: Business development
      description: Helping grow Skylight's business by spotting and advancing the right opportunities, supporting contract development, renewal, and client strategy, and contributing to lifecycle growth work
    levels:
    - level: Associate
      decisions_ownership: Executes defined delivery-coordination tasks with guidance (tracker updates, notes, action tracking)
      consulting_scope: Responds to stakeholder requests with guidance; contributes to shared delivery artifacts
      impact: Completes coordination tasks reliably; trackers, notes, and action logs are clear and current
      calibration_question: Can they reliably complete assigned delivery-coordination tasks with minimal rework?
      mission: Develop foundational delivery-coordination skills while supporting an engagement.
      success_looks_like:
      - Maintains trackers, notes, and action logs with reliable follow-through
      - Captures owners, due dates, and decisions so nothing drifts silently
      - Produces clear, client-ready documentation
      - Collaborates effectively with delivery, product, and engineering partners
      - Communicates status clearly and surfaces blockers promptly
      example_outcomes:
      - A current, decision-useful tracker that kept a workstream's owners and due dates clear
      - Meeting notes and action items that prevented follow-through from slipping
      - A re-planned tracker after a mid-sprint scope change
      - Clean status documentation a government program manager could read without translation
    - level: I
      decisions_ownership: Decides approach for well-scoped delivery-operations work; owns execution visibility for a defined workstream
      consulting_scope: Builds working relationships with direct counterparts; communicates status and risks clearly
      impact: Improves the predictability or velocity of the workstream they support
      calibration_question: Can they be trusted to keep a workstream's execution visibility current without close oversight?
      mission: Own delivery-operations for a well-scoped workstream independently.
      success_looks_like:
      - Decides the approach for well-scoped delivery-operations work
      - Owns execution visibility (milestones, dependencies, risks, decisions) for a workstream
      - Surfaces emerging risks early with context and options
      - Re-plans trackers and documentation quickly when priorities shift
      - Communicates status and risks clearly to teammates and stakeholders
      example_outcomes:
      - A workstream risk surfaced early enough to be mitigated rather than escalated late
      - A reporting cadence that gave the engagement manager and client a reliable read on delivery
      - Dependencies mapped so a cross-team handoff happened without slippage
      - An SOP or tracker template the team reused
    - level: II
      decisions_ownership: Decides approach for ambiguous delivery-operations problems; owns coordination, risk-surfacing, and artifact quality for a workstream end-to-end
      consulting_scope: Proactively manages stakeholder expectations and facilitates working sessions; produces client-ready delivery artifacts that land without heavy revision
      impact: Their coordination measurably improves delivery predictability in the work they own
      calibration_question: Can they own ambiguous delivery-operations work end-to-end without escalating?
      mission: Lead delivery-operations for a workstream or service component.
      success_looks_like:
      - Decides the approach for ambiguous delivery-operations problems
      - Owns coordination, risk-surfacing, and artifact quality for a workstream end-to-end
      - Proactively manages stakeholder expectations and facilitates working sessions
      - Produces client-ready delivery artifacts that land without heavy revision
      - Improves delivery predictability in the work they own
      example_outcomes:
      - Improved delivery predictability for a workstream after tightening risk and action discipline
      - A risk surfaced and mitigated before it affected a client commitment
      - Client-ready briefings and dashboards adopted as the workstream's standard
      - A re-planning approach that kept delivery clear through a major scope shift
    - level: Senior
      decisions_ownership: Makes consequential delivery tradeoff decisions; owns delivery for an engagement (scope, staffing, cadence, risk, and the client relationship), running it the agile, flexible way and leading the team by enabling it
      consulting_scope: Navigates competing priorities and builds durable trust with senior stakeholders; resets expectations early when commitments are at risk
      impact: Improves delivery and client outcomes for the program because of decisions they made, not just the work they coordinated
      calibration_question: Would removing this person meaningfully change the delivery trajectory or client trust for the engagement?
      mission: Lead delivery for a program or engagement.
      success_looks_like:
