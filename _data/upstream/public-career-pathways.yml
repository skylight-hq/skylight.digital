    public_headline: Find out how we build and run the software government services depend on, and the skills you need at each level.
    mission: Engineering practitioners design, build, and operate the software systems that government services depend on. They turn product and policy intent into working, secure, accessible technology — making sure the systems that result are reliable in production, defensible under audit, and clear enough for the next team to maintain.
    applies_levels:
    - Associate
    - I
    - II
    - Senior
    - Staff
    - Principal
    core_craft:
    - area: Software development and delivery
      description: Writing, reviewing, and shipping working code in a shared codebase, using leading version-control, testing, and release practices
    - area: System architecture and design
      description: Designing how the pieces of a system fit together — services, data flow, interfaces, and integration with other systems
    - area: Delivery and operations
      description: Running systems in production reliably — pipelines, deployments, observability, incident response, and on-call practice
    - area: Security, privacy, and compliance
      description: Building secure systems and navigating government compliance requirements like FISMA, FedRAMP, HIPAA, and the Privacy Act
    - area: User and mission focus
      description: Centering the people who use the system and the mission it serves — accessibility, usability, and equity of access
    - area: Cost and resource stewardship
      description: Treating compute, storage, and licensing as a constrained public resource — sizing systems to real demand, making spend visible and attributable, and building guardrails that catch waste before it compounds
    levels:
    - level: Associate
      decisions_ownership: Executes defined engineering tasks with guidance from more experienced engineers
      consulting_scope: Responds to stakeholder and teammate requests with guidance; contributes to shared code, infrastructure, and documentation
      impact: Their assigned engineering work is done reliably — code, configuration, or remediations land with little rework
      calibration_question: Can they deliver defined engineering tasks reliably, with guidance?
      mission: Develop foundational engineering skills while contributing reliably to a delivery team.
      success_looks_like:
      - Completes well-scoped coding, configuration, or remediation tasks with guidance
      - Implements feedback from code review without repeated rework
      - Writes basic tests and documentation for the work they ship
      - Collaborates effectively with teammates and asks for help at the right moments
      - Builds awareness of security, privacy, and accessibility practices on their team
      example_outcomes:
      - A bug fix or small feature shipped to production after passing code review
      - A pipeline configuration change or environment update completed cleanly
      - A documented remediation for a basic security finding flagged in scanning
      - An accessibility issue caught and fixed in a component before release
    - level: I
      decisions_ownership: Decides approach for well-scoped engineering work; owns a defined feature, service component, pipeline change, or remediation within a larger effort
      consulting_scope: Builds working relationships with direct counterparts on the team; communicates technical progress and tradeoffs clearly
      impact: The engineering work they own is done well and on pace
      calibration_question: Can they be trusted to decide the approach for well-scoped engineering work without close oversight?
      mission: Contribute reliably within a feature area or service, deciding the approach for well-scoped pieces.
      success_looks_like:
      - Owns a defined piece of work — a feature, a pipeline change, a security ticket, a network configuration — end-to-end within a larger effort
      - Writes tests, documentation, and clear commit history without being prompted
      - Implements code review feedback and gives useful feedback on others' work
      - Communicates progress, blockers, and tradeoffs clearly to the team
      - Identifies basic security, privacy, and accessibility issues in their work and addresses them
      - Works effectively with product, design, and delivery counterparts on shared work
      example_outcomes:
      - A feature delivered end-to-end with tests, documentation, and a clean handoff
      - A CI/CD improvement that reduces flaky builds or deployment friction
      - A security finding triaged, mitigated, and documented for the team
      - A front-end component built to meet accessibility requirements and adopted by other engineers
    - level: II
      decisions_ownership: Decides approach for ambiguous engineering problems; owns a feature, service, pipeline, or security area end-to-end
      consulting_scope: Proactively manages technical expectations and facilitates working sessions and design discussions; produces client-ready technical artifacts (designs, ADRs, demos) that land without heavy revision
      impact: Their engineering work measurably improves the system in their area — performance, reliability, security posture, or delivery speed
      calibration_question: Can they own ambiguous engineering work end-to-end and make decisions without escalating?
      mission: Own a feature, service, pipeline, or security area end-to-end, including the ambiguous parts.
      success_looks_like:
      - Owns a service component, feature, pipeline, or security area end-to-end, including design decisions
      - Makes sound tradeoff decisions on approach, scope, and sequencing without escalating routine choices
      - Produces technical artifacts — architecture sketches, ADRs, runbooks, demos — that land with clients and teammates without heavy revision
      - Participates meaningfully in on-call, incident response, or security review rotations
      - Considers security, privacy, accessibility, and operability as part of the design, not after the fact
      - Facilitates technical working sessions and reviews that move decisions forward
      - Mentors Associates and Level I engineers through pairing and code review
      example_outcomes:
      - A service component refactored to improve reliability or performance, with measurable results
      - An authentication or authorization flow designed and shipped end-to-end
      - A pipeline restructured to add automated security scanning or zero-downtime deployment
      - A network configuration change designed, tested, and rolled out without disruption
      - A security-finding remediation pattern documented and adopted by other engineers on the team
    - level: Senior
      decisions_ownership: Makes consequential architecture, security, and operational tradeoff decisions; owns a capability area such as a platform service, the CI/CD stack, or the team's security posture
      consulting_scope: Navigates competing technical priorities and reframes problems for senior client stakeholders in their capability area; influences how the team approaches technical questions
      impact: Engineering outcomes in their area improve because of decisions they made — system reliability, ATO readiness, deployment cadence, or developer productivity — not just the code they shipped
      calibration_question: Would we lose meaningful technical judgment, not just capacity, if they stepped away?
      mission: Lead the engineering work for a capability area on a delivery team — making the consequential calls and lifting the team's craft.
      success_looks_like:
      - Sets technical direction for a capability area — a service, a platform component, the CI/CD stack, the team's security posture, or a network domain
      - Makes consequential tradeoff decisions on architecture, security, operations, and delivery cadence
      - Leads the team through complex work like compliance milestones, incident response, modernization, or platform migrations
      - Communicates technical direction and tradeoffs clearly to product, design, delivery, and client stakeholders
      - Mentors junior and mid-level engineers through code review, pairing, design discussions, and direct coaching
      - Strengthens the team's engineering judgment alongside their own work — code review standards, design review rituals, on-call practice
      - Influences how the team approaches user focus, accessibility, and mission outcomes in technical decisions
      example_outcomes:
      - An architecture decision that improved system reliability, performance, or security posture for a capability
      - A platform service redesigned to support multiple consuming teams without rework
      - A security review process the team adopted that caught issues earlier and made ATO milestones smoother
      - An on-call and incident response practice that reduced mean time to recovery on a critical service
      - A modernization slice — a legacy component replaced or refactored — that unblocked further investment
      - A junior engineer who grew measurably under their mentorship into independent ownership
    - level: Staff
      decisions_ownership: Sets technical direction across workstreams or teams; owns shared systems, standards, or initiatives that span teams (e.g., API standards, platform infrastructure, security review processes)
      consulting_scope: Influences program-level technical strategy; resolves architectural and organizational blockers across teams and stakeholder groups
      impact: Other engineering workstreams move faster or improve in quality because of the systems, standards, or direction they put in place
      calibration_question: Would coordination, technical standards, or cross-team delivery slip if this person stepped away?
      mission: Improve engineering quality and velocity across multiple teams or programs through shared systems, standards, and direction.
      success_looks_like:
      - Sets technical direction across workstreams, teams, or contracts — not just within one
      - Identifies systemic technical issues that no single team would see and addresses them
      - Owns shared systems, standards, or initiatives — API standards, platform infrastructure, security review processes, observability conventions, network architecture patterns
      - Resolves cross-team architectural disagreements and unblocks delivery
      - Influences program-level technical strategy with client leadership
      - Mentors engineers across teams and helps Seniors grow into cross-team thinking
      - Establishes engineering practices that other workstreams adopt
      example_outcomes:
      - A shared API standard or platform service adopted by multiple delivery teams that reduced duplicate work
      - A CI/CD or infrastructure-as-code pattern rolled out across programs that cut deployment time or reduced incidents
      - A cross-team security review or compliance program that smoothed ATO across multiple systems
      - A modernization strategy across multiple workstreams that resolved architectural disagreements and set a shared direction
      - A network architecture standard that enabled consistent connectivity and segmentation across hybrid environments
    - level: Principal
      decisions_ownership: Reframes technical problems and influences mission-level direction for the client in their area; contributes meaningfully to Skylight's growth
      consulting_scope: Trusted technical authority for client leadership; represents Skylight externally in their engineering domain through speaking, publishing, or community leadership
      impact: The client adopts a different technical approach to part of its mission because of their work; new opportunities open for Skylight
      calibration_question: Would the client's approach to its mission or Skylight's growth trajectory in engineering be different if they hadn't been here?
      mission: Reshape how clients approach part of their mission through engineering, and help Skylight grow as an engineering organization.
      success_looks_like:
      - Reframes technical problems and influences how the client thinks about part of its mission — modernization strategy, security posture, platform direction, or service-delivery approach
      - Identifies major opportunities to improve government service delivery through engineering and brings clients along
      - Aligns client technical leadership around architectural or operational direction
      - Guides major tradeoffs across programs — build versus buy, modernization sequencing, security and compliance investment
      - Contributes to Skylight's Engineering practice area through hiring, leveling, craft standards, and developing Staff-level engineers
      - Contributes to Skylight's growth through proposals, expanded scope with existing clients, or opening new engineering opportunities
      - Represents Skylight externally through speaking, publishing, open source, or community leadership in their engineering domain
      example_outcomes:
      - A modernization approach the client adopted across multiple programs after a Principal-led technical assessment
      - A platform or shared-services strategy that changed how an agency invests in technology across its portfolio
      - A security or compliance framework adopted across a client's organization that meaningfully changed its risk posture
      - A successful proposal or contract expansion where the Principal's engineering credibility was a decisive factor
      - An engineering hiring bar, craft standard, or technical career framework adopted across Skylight
  - id: data-and-analytics
    name: Data & Analytics
    pathway_status: ported
    role_count: 4
    public_headline: Find out how we turn government data into decisions people can trust, and the skills you need at each level.
    mission: Data & Analytics practitioners help teams and clients make decisions grounded in evidence. They build the pipelines, platforms, and models that turn raw government data into something usable, and they translate analytical findings into insights that move products, services, and policy forward. They work across the full data lifecycle — collection, cleaning, storage, analysis, transformation, visualization, and communication — while protecting privacy and security.
    applies_levels:
    - Associate
    - I
    - II
    - Senior
    - Staff
    - Principal
    core_craft:
    - area: Data pipelines and platforms
      description: Building, operating, or working with the systems that ingest, transform, store, and serve data reliably
    - area: Modeling and analysis
      description: Selecting and applying the right methods — from simple aggregations to advanced models — to solve the problem
    - area: Code quality and engineering practices
      description: Writing readable, tested, reusable code that other practitioners can understand and extend (for Data Engineers, production pipeline and platform code; for Data Scientists, reproducible analysis code and notebooks others can rerun and build on)
    - area: Security, privacy, and compliance
      description: Protecting sensitive data — including personally identifiable information (PII) and protected health information (PHI) — across the full lifecycle, from ingestion through analysis and presentation
    - area: Communication and storytelling
      description: Translating data work into insights that stakeholders can understand and act on (for Data Engineers, making the system legible to technical partners; for Data Scientists, turning insights and tradeoffs into decisions for non-technical stakeholders)
    - area: Stakeholder and mission grounding
      description: Working with stakeholders to identify the right questions, and connecting data work to the client's mission outcomes
    levels:
    - level: Associate
      decisions_ownership: Executes defined data engineering or analysis tasks, with guidance
      consulting_scope: Responds to stakeholder requests with guidance; contributes to shared artifacts like pipeline code, notebooks, queries, and visualizations
      impact: Their assigned data work is done reliably, with little rework — pipelines run, queries return correct results, and analyses and visualizations are clear and ready to use
      calibration_question: Can they deliver defined data tasks reliably, with guidance?
      mission: Develop foundational data engineering or data science skills while supporting a delivery team.
      success_looks_like:
      - Supports pipeline, analysis, or visualization work with reliable follow-through
      - Writes clear, working code or queries that match the team's conventions
      - Handles sensitive data carefully and follows privacy and security guidance
      - Communicates findings and technical decisions clearly to teammates
      - Asks questions to understand the data, the stakeholder, and the underlying program
      example_outcomes:
      - A pipeline component or query that runs correctly and matches the team's conventions
      - Clean, well-documented code that another practitioner can pick up
      - A chart or dashboard panel that answers a specific stakeholder question
      - A handoff of de-identified or synthetic data set up correctly for development and testing
    - level: I
      decisions_ownership: Decides the approach for well-scoped data work; owns a defined piece of a larger data effort — a pipeline component, a specific analysis, a dashboard, or a transformation
      consulting_scope: Builds solid working relationships with their direct counterparts on the team; communicates findings and technical decisions clearly
      impact: The data work they own is done well and on pace
      calibration_question: Can they choose the right approach for well-scoped data engineering or analysis work without close oversight?
      mission: Apply data engineering or data science methods independently to a defined piece of the team's data work.
      success_looks_like:
      - Owns a pipeline component, a specific analysis, a dashboard, or a transformation within a larger data effort
      - Writes working, tested code with minimal guidance
      - Picks appropriate standard methods for the problem — aggregations, joins, regressions, clustering, basic visualizations
      - Identifies data quality or pipeline issues early and resolves or escalates them
      - Builds direct relationships with the team members and stakeholders who depend on their work
      - Articulates the value of their work to teammates and stakeholders
      example_outcomes:
      - A pipeline transformation that handles a tricky source-system quirk without breaking downstream
      - An analysis that gave the team a clear, defensible answer to a stakeholder question
      - A dashboard that the team and client actually use to track program outcomes
      - A migration of a small dataset off a legacy system with no loss of fidelity (Legacy Modernization variant)
      - A metric definition or data collection approach that gave the team a defensible way to measure a program outcome
      - A code review on a teammate's pipeline that caught a real issue
    - level: II
      decisions_ownership: Decides the approach for ambiguous data problems; owns a pipeline, an analysis, or a model end to end (e.g., a multi-source ingestion pipeline for a Data Engineer, an end-to-end analysis or model for a Data Scientist)
      consulting_scope: Manages stakeholder expectations proactively on data and analysis questions; facilitates working sessions and reviews that end in decisions; produces client-ready data products, analyses, and visualizations that land without heavy revision
      impact: The pipeline, analysis, or model they own delivers its intended outcome — it runs reliably, the analysis answers the question, the model performs in production
      calibration_question: Can they own an ambiguous pipeline, analysis, or model end to end and make the calls without escalating?
      mission: Lead a pipeline, analysis, or model end-to-end through ambiguity.
      success_looks_like:
      - Owns a complex pipeline, an end-to-end analysis, a model, or a measurement problem end-to-end — including framing the question and defining the metrics, not just building
      - Defines and tracks the outcome the work is meant to produce — not just whether it ran
      - Makes methodology and architecture tradeoffs and explains the reasoning clearly
      - Runs the stakeholder conversation for their work without senior backup, including pushing back on questions the data can't actually answer
      - Produces client-ready artifacts — analyses, models, visualizations, pipeline documentation — that land without heavy revision
      - Handles privacy and security tradeoffs appropriately, including de-identification choices and re-identification risk
      - For a Data Engineer, may own a substantial pipeline or platform component end-to-end; for a Data Scientist, may own an end-to-end analysis or production model
      example_outcomes:
      - A multi-source ingestion pipeline that consolidated data from three legacy systems into a single, query-ready store
      - An analysis that surfaced a previously unseen pattern in eligibility, enrollment, or program participation and shifted how the team prioritized work
      - A production model — predictive, classification, or otherwise — that performs reliably and is interpretable enough for stakeholders to trust
      - A dashboard or visualization that became the canonical view the client uses for a program metric
      - A problem-framing and metric-definition effort that changed what a program was measuring, not just how
      - A privacy review and de-identification approach for a sensitive dataset that let the team move forward without compromising protection
    - level: Senior
      decisions_ownership: Makes the consequential tradeoff calls on architecture, methodology, and how data is used; owns a data platform or analytical capability their operating context — their engagement or program — depends on
      consulting_scope: Navigates competing priorities and turns messy data situations in their area into clear choices for decision-makers; runs the data conversation with the client for their product or program without senior backup
      impact: Their area's data outcomes — what gets built, how it performs, what decisions it enables — improve because of decisions they made, not just work they delivered
      calibration_question: If they stepped away, would the team lose data judgment, not just capacity?
      mission: Own the data platform or analytical capability for a product or program and guide its direction.
      success_looks_like:
      - Owns the data platform, pipeline architecture, or analytical capability for a product or program of meaningful scope
      - Makes consequential tradeoff calls on architecture, tooling, methodology, and/or how data is used to inform decisions
      - Acts as a trusted advisor to client stakeholders, including senior ones, on data questions and reframes problems for them
      - Runs the full data conversation for their product or program without senior backup
      - Anticipates data, privacy, or compliance risks before they hit the team
      - Builds alignment across product, design, engineering, and the client around how data flows through the system and what it's used for
      - Mentors junior and mid-level practitioners on the team through code review, working sessions, and direct collaboration
      - Strengthens the team's data and analytical judgment alongside their own work
      - Contributes to business development on the engagement — recompetes, scope expansions, or proposal input on data work
      example_outcomes:
      - A data platform redesign that cut pipeline runtime substantially while reducing cost, and that other teams started borrowing from
      - An analytical capability built into a product that gave program staff a real-time view of an outcome they couldn't previously see
      - A modeling approach adopted by the client across multiple programs after evidence of impact on a first program
      - A privacy and compliance approach for sensitive data — including de-identification, access controls, and audit — that let the engagement scale up data sharing safely
      - A first-time technical lead on the team who's now running their own data workstream
      - A renewed or expanded contract grounded in data work the client trusts
    - level: Staff
      decisions_ownership: Sets data direction for their whole operating context and owns the systems and standards it runs on — shared data platforms, modeling standards, privacy and compliance approaches, cross-team data architecture
      consulting_scope: Gets teams across their operating context pulling in the same direction on data priorities and influences program-level data strategy with client leadership; clears data blockers no single team can clear
      impact: Their whole operating context produces better data work because of the systems, standards, and direction they put in place, and it travels to other teams and engagements
      calibration_question: If they stepped away, would data work across their operating context lose direction, not just a strong contributor?
      mission: Improve data outcomes across the whole operating context.
      success_looks_like:
      - Sets data direction across multiple workstreams or teams
      - Identifies systemic data issues — quality, architecture, methodology, privacy — across engagements that no single team would see
      - Establishes shared practices — data platforms, modeling standards, privacy and compliance approaches, code review norms — that other engagements adopt
      - Resolves tradeoffs around data architecture, tooling, or analytical approach across the operating context
      - Mentors practitioners across teams or engagements
      - Influences program-level data strategy with senior client stakeholders across more than one program area
      - Strengthens cross-team decision-making on data and analytical questions
      - Contributes to Skylight's growth through proposal contributions, scope expansions, or new opportunity development
      example_outcomes:
      - A shared data platform or analytical framework adopted across multiple engagements that reduced ramp-up time for new teams
      - A modeling or analytical standard — interpretability requirements, evaluation criteria, documentation expectations — that improved consistency across the practice area
      - A cross-engagement privacy and de-identification approach that gave Skylight a defensible position when negotiating data access with new clients
      - A synthesis across two or three engagements that revealed a shared client data challenge and shifted how Skylight approaches that domain
      - A new contract or scope expansion that came directly from data work and relationships they built
      - A practitioner who's now making complex tradeoff decisions because of their coaching
    - level: Principal
      decisions_ownership: Decides, with client leadership, what data should accomplish in part of the client's mission, cutting through the noise to diagnose the root cause; shares ownership of Skylight's own health and growth
      consulting_scope: A trusted advisor up to client leadership on data strategy, analytics, and how data informs the mission — aligns stakeholders on the solution and earns their buy-in; a recognized voice in the field who represents Skylight externally in data engineering, data science, or the client domain
      impact: The client approaches part of its mission differently because of their data work, and Skylight is stronger for it — they help open new opportunities through proposals, expanded scope, or new clients
      calibration_question: If they'd never been here, would the client's approach to its mission — or Skylight's growth trajectory in data — be on a different path?
      mission: Shape data strategy across portfolios or mission areas, and help open new opportunities for Skylight.
      success_looks_like:
      - Reframes problems and influences how the client thinks about data's role in part of its mission
      - Aligns client leadership around data direction across multiple programs — what to collect, what to model, what to make actionable
      - Guides major tradeoffs on data architecture, analytical investment, or how data informs policy and program design
      - Acts as an external authority on data engineering or data science in the client's domain — through speaking, writing, or recognized expertise
      - Contributes to Skylight's Data & Analytics practice area through hiring, leveling, craft standards, and supporting practitioners across the practice area
      - Contributes to Skylight's growth through proposal contributions, expanded scope with existing clients, or new client opportunities
      - Improves organizational learning from how data work runs across engagements
      example_outcomes:
      - A program or agency function reorganized around a data approach the Principal brought — changing how the client measures outcomes, allocates resources, or designs services
      - A new contract won at an existing client because of data credibility built across prior engagements
      - A proposal effort they led or contributed to that brought in new mission work for Skylight, particularly work that required deep data expertise
      - A data architecture or analytical approach adopted across a client portfolio that materially changed how the agency uses data
      - A change across the whole practice area at Skylight — a leveling rubric, a privacy standard, a modeling approach, a hiring rubric — that raised the bar across all Data & Analytics engagements
      - An external presence (talks, publications, recognized expertise) that brought new opportunities to Skylight
  - id: strategy-and-change
    name: Strategy & Change
    pathway_status: ported
    role_count: 5
    public_headline: Find out how we help agencies change the way they work and make it last, and the skills you need at each level.
    mission: 'Strategy & Change practitioners help government agencies change how they work and build the skills and capacity to keep that change going. The change might be in how an agency delivers its services, in the systems and skills its staff use every day, or in how it attracts, assesses, and hires digital talent. Whatever the change, they start with an honest read of where the agency stands and a plan its leaders can carry out. They design the programs, processes, and coaching that bring people along: training staff on a new system, guiding leaders through a shift in management and culture, or helping hiring managers define roles and evaluate candidates in a structured, fair way. And they measure whether the change took hold, aiming to leave the agency able to carry it forward after a launch or an engagement ends.'
    applies_levels:
    - Associate
    - I
    - II
    - Senior
    - Staff
    - Principal
    core_craft:
    - area: Organizational assessment
      description: Diagnosing an agency's digital capability, maturity, and performance across focus areas like talent, delivery practices, data, and procurement
    - area: Strategy and roadmapping
      description: Translating assessment findings into prioritized, sequenced plans for change — and revisiting them as the agency learns
    - area: Audience understanding and tailoring
      description: Identifying the distinct groups a change affects, by role, context, skill level, or risk profile, and tailoring the approach to each without creating overhead
    - area: Enablement and program design
      description: Designing scalable systems — not one-off events — that combine instruction, practice, reinforcement, and measurement to drive real behavior change
    - area: Hiring design and evaluation
      description: Helping an agency define the roles it needs and design how it finds, screens, and evaluates candidates, working alongside its hiring team with a consistent, fair bar and a respectful candidate experience its own managers can keep running
    - area: Change leadership and culture
      description: Creating the conditions for organizational change — building trust, navigating resistance, partnering with internal change agents
    - area: Delivery and facilitation under ambiguity
      description: Moving work forward when requirements, releases, or scope are still evolving — making assumptions explicit, protecting users and teams from volatility, and maintaining momentum
    - area: Cross-functional and operational coordination
      description: Partnering across product, engineering, design, delivery, contracts, and client stakeholders to keep each change aligned with the delivery work it serves
    - area: Plain-language and operational clarity
      description: Producing materials, comms, and artifacts grounded in real workflows — written so people can act on them, not just consume them
    - area: Coaching and capability building
      description: Building the agency's own ability to sustain modern practices, including hiring, training, and developing internal talent
    - area: Measurement and iteration
      description: Defining what "working" means for a change (adoption, skill growth, support load, hiring conversion) and using that signal to refine the work while it is still running
    - area: Hiring quality and pipeline health
      description: Helping an agency see and improve how its hiring performs (time-to-fill, quality of hire, conversion, and bottlenecks) and building the rubrics and workflows its hiring managers reuse
    - area: Measurement and outcome accountability
      description: Defining what success means for a change and holding the work to it — choosing outcome measures tied to mission impact (or credible proxy signals when data is thin), tracking whether recommendations were actually adopted, and adapting when the evidence says the plan is not working
    levels:
    - level: Associate
      decisions_ownership: Executes defined Strategy & Change tasks in their craft, with guidance
      consulting_scope: Responds to team and stakeholder requests with guidance; contributes to shared artifacts like training materials, comms drafts, assessment interview notes, and draft screening rubrics
      impact: Their assigned work is done reliably — materials, notes, and research findings are clear and accurate, with little rework
      calibration_question: Can they deliver defined Strategy & Change tasks reliably, with guidance?
      mission: Develop foundational Strategy & Change skills while supporting an engagement team.
      success_looks_like:
      - Supports training, comms, assessment, hiring-process, or program activities with reliable follow-through
      - Produces clear training materials, comms drafts, interview and document-review notes, or draft role definitions and screening rubrics
      - Builds working relationships with teammates and observes how senior practitioners handle agency leaders, program staff, hiring managers, and resistance to change
      - Communicates progress and questions clearly to the team
      - Asks questions to understand the engagement, the agency, the mission, the user, and the role being hired
      example_outcomes:
      - A training session run cleanly with materials that hold up to senior review
      - A clean set of interview notes or document-review findings that the team can synthesize without re-doing the work
      - An accurate record of where each candidate stands in an agency's hiring process, with clear next steps for the agency's hiring team
      - A draft role definition, screening rubric, or training module that holds up to senior review
      - Meeting notes, office hours notes, or hiring debrief notes that keep decisions and follow-ups from getting lost
    - level: I
      decisions_ownership: Decides the approach for well-scoped work; owns a defined piece of a larger effort, such as a focus-area assessment, a training session, a release-aligned comms cycle, or the screening design for one agency role
      consulting_scope: Builds solid working relationships with direct counterparts on the team and at the agency — program staff, hiring managers, and the people living through the change; communicates progress clearly and closes loops reliably
      impact: The piece of work they own is done well and on pace
      calibration_question: Can they choose the right approach for well-scoped Strategy & Change work without close oversight?
      mission: Apply Strategy & Change methods independently to a defined piece of the engagement.
      success_looks_like:
      - Owns a defined piece of a larger engagement, such as a focus-area assessment, a training session, a release-aligned comms cycle, or the screening design for one agency role
      - Designs and delivers training materials, conducts assessment interviews and document review, or designs structured candidate screens with an agency's hiring team, with minimal guidance
      - Builds direct relationships with agency counterparts — program staff, change leads, hiring managers — and communicates clearly with them
      - Identifies risks early — adoption gaps, resistance to a change, candidate dropoff, requirements drift — and resolves or escalates them
      - Iterates on their part of the program, plan, or hiring process based on what's working
      - Articulates the value of their work to the team and the client
      example_outcomes:
      - A training cohort delivered on schedule with positive feedback and visible adoption
      - A release-aligned comms cycle that landed cleanly with users
      - A capability assessment for a single focus area (for example, delivery practice, data maturity, or hiring practices) that gave the client a defensible read on the current state
      - A structured screen for a defined agency role that the hiring manager used to make a confident, well-documented selection
      - A retro that surfaced a real adoption, change, or hiring issue and led to a process change
      - A screening rubric, assessment guide, or training module that other team members started using
    - level: II
      decisions_ownership: Decides the approach for ambiguous problems; owns a program or workstream end to end, such as a multi-focus-area assessment, an enablement program or release-aligned rollout, or the redesign of an agency's hiring process for a set of roles
