  - id: practice-excellence
    name: Practice Excellence
    pathway_status: ported
    role_count: 2
    public_headline: Find out how we set and keep the standard for great work across Skylight, and the skills you need at each level.
    mission: Practice Excellence practitioners raise the craft bar across Skylight. They own a practice area's standards, leveling, hiring, and capability so delivery quality is consistent and improving across teams and contracts. They turn what good looks like in a practice area into standards, review rhythms, and competency systems that hold up across engagements. They also support projects directly, so the practice area's reputation is earned in delivery.
    applies_levels:
    - Senior
    - Staff
    - Principal
    core_craft:
    - area: Standards and quality governance
      description: Defining a practice area's standards, patterns, and expectations, and the regular reviews, calibration, and quality measures that keep them in use and consistent across engagements
    - area: Capability development
      description: Building the competency frameworks, mentorship systems, and skill-progression guidance that help practitioners grow across the practice area
    - area: Hiring and leveling
      description: Strengthening hiring standards, interviewer calibration, and consistent evaluation across roles and levels so hiring and leveling decisions reflect how people perform on the job
    - area: Delivery health and support
      description: Keeping a clear view of delivery health across teams, identifying systemic risks or skill gaps early, and stepping in when an engagement needs extra support with quality, clarity, or delivery confidence
    - area: Practice area strategy and representation
      description: Aligning a practice area's direction with company strategy, delivery realities, and financial constraints, and representing the practice area internally and externally to strengthen its positioning in growth efforts
    - area: Consistent standards across practice areas
      description: Making the practice areas' standards work as one system — reconciling design, product, engineering, and data expectations where they differ, and building them into how teams deliver
    levels:
    - level: Senior
      decisions_ownership: Makes consequential craft-standard decisions; owns an aspect of a practice area's quality or capability
      consulting_scope: Influences how teams approach craft quality; reframes craft problems for practitioners and leadership
      impact: Craft quality improves in their area because of the standards or coaching they put in place
      calibration_question: Would craft quality or consistency slip in their area if they stepped away?
      mission: Own an aspect of a practice area's craft quality or capability.
      success_looks_like:
      - Defines and coaches craft standards within a team or part of a practice area, and gets them adopted
      - Strengthens hiring and leveling judgment for the practice area through calibration and review
      - Raises craft quality through reviews, mentorship, and shared practices practitioners actually use
      - Surfaces craft-quality risks in their area early and turns them into concrete action
      - Steps in when a piece of work needs extra support and helps strengthen quality and delivery confidence
      example_outcomes:
      - A review cadence and rubric adopted in part of a practice area that caught quality drift earlier
      - An interview rubric or calibration session that made hiring signals more consistent across a panel
      - A mid-level practitioner who grew measurably under their coaching into independent ownership
      - A deliverable that needed extra support brought up to standard through hands-on involvement
    - level: Staff
      decisions_ownership: Sets craft direction across a practice area; owns standards, leveling rubrics, hiring bars, or capability programs
      consulting_scope: Influences strategy for the practice area; resolves organizational blockers to craft quality across teams
      impact: Multiple teams deliver more consistent, higher-quality work because of the standards and systems they own
      calibration_question: Would cross-team craft standards or leveling consistency slip if they stepped away?
      mission: Set craft direction across a practice area.
      success_looks_like:
      - Establishes standards, leveling rubrics, or capability programs adopted across teams
      - Improves hiring bars and calibration consistency for the practice area across interviewers and levels
      - Resolves cross-team craft-quality gaps no single team would see
      - Keeps a clear view of delivery health across teams and acts on systemic risk early
      - Steps in when an engagement needs extra support and leaves the team better able to sustain quality
      - Aligns the practice area's direction with delivery realities and financial constraints so it can actually be staffed
      example_outcomes:
      - A competency framework or leveling guide adopted across a practice area that gave teams a shared language for growth
      - A hiring loop and calibration practice that raised consistency and made promotion cases more defensible
      - A delivery-health read that surfaced a systemic skill gap across teams and drove a capability investment
      - An engagement given extra support, with the team able to hold the standard afterward
    - level: Principal
      decisions_ownership: Reframes how Skylight defines excellence in a practice area; contributes meaningfully to Skylight growth
      consulting_scope: Trusted authority on the practice area internally and externally; represents Skylight's craft reputation
      impact: Skylight's reputation and capability in the practice area are materially stronger because of their work
      calibration_question: Would Skylight's standing or capability in the practice area be different if they hadn't been here?
