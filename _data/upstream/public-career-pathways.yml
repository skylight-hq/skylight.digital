  - id: domain-expertise
    name: Domain Expertise
    pathway_status: ported
    role_count: 1
    public_headline: Find out how we bring deep knowledge of a client's field into the work, and the skills you need at each level.
    mission: Domain Expertise practitioners bring deep subject-matter knowledge to delivery teams and clients. They translate mission, policy, and program reality into guidance that product, design, engineering, and data partners can act on. They know how the work actually happens in their domain (clinical, regulatory, programmatic, operational) and how it differs across jurisdictions, agencies, and program contexts. They earn trust with both the mission experts on the client side and the technical teams on Skylight's side, and they sit at the seam where those two worlds have to align for digital services to work.
    applies_levels:
    - Associate
    - I
    - II
    - Senior
    - Staff
    - Principal
    core_craft:
    - area: Domain practice fluency
      description: Deep working knowledge of how the domain operates in real organizations — including staffing constraints, decision rights, regulatory environment, and how the work differs across jurisdictions or program contexts
    - area: Workflow and policy translation
      description: Converting policy, guidance, and standard practice into implementable workflows, role definitions, edge cases, and data requirements that delivery teams can build to
    - area: Stakeholder trust and influence
      description: Building credibility with mission experts (federal program leaders, STLT counterparts, program staff, oversight bodies) and earning the standing to push back, reframe, and align them
    - area: Cross-functional partnership
      description: Working with product, design, engineering, and data teams — bringing clear recommendations with tradeoffs and translating technical constraints back into language stakeholders can act on
    - area: Prioritization under constraint
      description: Identifying the highest-impact problems given staffing, policy, and program realities; sequencing work responsibly when everything matters
    - area: Practice asset creation
      description: Producing reusable artifacts — playbooks, workflow standards, decision records, briefing docs — that scale domain knowledge across teams and outlast any single engagement
