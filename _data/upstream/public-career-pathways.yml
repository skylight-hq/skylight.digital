  - id: digital-acquisition
    name: Digital Acquisition
    pathway_status: ported
    role_count: 1
    public_headline: Find out how we help agencies buy technology in ways that set digital projects up to succeed, and the skills you need at each level.
    mission: Digital Acquisition practitioners help government agencies buy technology and services in ways that support modern digital delivery. They shape market research, acquisition strategy, solicitations, and evaluation approaches that produce better outcomes for digital projects. They sit close to client leadership and contracting officers, and they connect modern technical practice to the procurement vehicles, policies, and people that have to support it.
