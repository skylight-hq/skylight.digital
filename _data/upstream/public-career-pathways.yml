      consulting_scope: Influences program- and portfolio-level strategy; resolves organizational blockers that affect delivery across stakeholder groups
      impact: Other delivery workstreams run better because of the standards, systems, or direction they put in place
      calibration_question: Would delivery quality, predictability, or cross-team standards slip if they stepped away?
