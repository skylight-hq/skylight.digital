    role_count: 3
    public_headline: Find out how we attract and hire great people for Skylight, and the skills you need at each level.
    mission: Talent Acquisition practitioners attract and hire the people Skylight depends on. They own full-cycle recruiting and hiring partnership across the company — turning workforce needs into clear roles, structured and fair candidate evaluation, and a respectful candidate experience — so Skylight hires well, hires fairly, and builds a workforce equal to its delivery and growth commitments.
    applies_levels:
    - Coordinator
    - Associate
    - I
    - II
    - Senior
    - Staff
    - Principal
    core_craft:
    - area: Sourcing and pipeline strategy
      description: Developing and executing targeted sourcing for priority roles, reading the relevant labor market, and shaping a pipeline that produces qualified candidates
    - area: Structured evaluation and the talent bar
      description: Running consistent, criteria-based screening and interviews — assessing role fit, motivation, and alignment against the same standard for every candidate, and holding the bar under hiring pressure
    - area: Pipeline management and recruiting operations
      description: Maintaining accurate ATS data, clear stage progression, and unambiguous next steps while managing multiple open roles with structured prioritization and reliable follow-through
    - area: Fairness and accessibility in hiring
      description: Applying consistent standards and designing outreach and evaluation that reduce bias risk, broaden the talent pool, and create an accessible, inclusive candidate experience
    - area: Recruiting analytics and learning
      description: Interpreting sourcing and pipeline metrics — response, conversion, time-in-stage, time-to-fill, quality of hire — to learn what's working and change recruiting decisions accordingly
    levels:
    - level: Coordinator
      decisions_ownership: Carries out routine recruiting coordination under direction; follows established hiring processes
      consulting_scope: Handles routine scheduling and candidate and interviewer communications; escalates anything non-routine
      impact: Keeps interviews scheduled, candidates informed, and hiring records accurate
      calibration_question: Can they reliably execute routine recruiting coordination with close direction?
      mission: Keep interview scheduling, candidate communications, and hiring records running reliably under direction.
      success_looks_like:
      - Schedules interviews and coordinates interviewers with reliable follow-through
      - Communicates clearly with candidates and interviewers, and escalates non-routine items appropriately
      - Keeps hiring records in the applicant tracking system current and accurate
      - Handles candidate information with discretion
      example_outcomes:
      - An interview loop scheduled cleanly, with every candidate and interviewer knowing what happens next
      - Hiring records kept accurate enough that the team works from them without double-checking
    - level: Associate
      decisions_ownership: Executes defined recruiting tasks with guidance
      consulting_scope: Responds to hiring-manager and candidate requests with guidance; contributes to hiring materials
      impact: Completes recruiting work reliably with minimal rework
      calibration_question: Can they reliably complete assigned recruiting tasks with minimal rework?
      mission: Develop foundational recruiting skills while supporting the function.
      success_looks_like:
      - Executes recruiting tasks with reliable follow-through
      - Keeps ATS records and candidate stages accurate, and communicates clearly with candidates
      - Runs structured preliminary screens against consistent criteria with guidance
      - Collaborates effectively with hiring managers and asks for help at the right moments
      - Applies fairness and accessibility practices in outreach and screening
      example_outcomes:
      - A set of candidates moved through early stages with clean ATS records and no dropped loops
      - Structured screen notes a hiring manager can act on without redoing the assessment
      - A sourcing list built for a priority role from a clear, documented search
      - A candidate kept informed and respected through a stage transition or a decline
    - level: I
      decisions_ownership: Decides approach for well-scoped recruiting work; owns sourcing and coordination for a set of roles
      consulting_scope: Builds working relationships with hiring managers; communicates pipeline status clearly
      impact: The hiring work they own is done well and on pace
      calibration_question: Can they be trusted to own recruiting for a set of roles without close oversight?
      mission: Own recruiting for a well-scoped set of roles.
      success_looks_like:
      - Decides the approach for well-scoped recruiting work and owns sourcing and coordination for a set of roles
      - Develops targeted sourcing and can explain what changed pipeline quality
      - Runs structured screens and applies consistent pass/fail thresholds
      - Communicates pipeline status, blockers, and next steps clearly to hiring managers
      - Keeps ATS records accurate and follows through across multiple open roles
      example_outcomes:
      - A reworked sourcing approach that lifted qualified-candidate flow for a hard-to-fill role
      - A set of roles filled with strong candidates and a clean, trustworthy pipeline behind them
      - A pipeline-status update a hiring manager used to make a decision without a follow-up meeting
      - A screening rubric applied consistently across a role's candidates so decisions were defensible
    - level: II
      decisions_ownership: Decides approach for ambiguous hiring problems; owns full-cycle recruiting for a function or team end-to-end
      consulting_scope: Proactively manages hiring-manager expectations and facilitates calibration; runs a consistent, respectful candidate experience
      impact: Their work measurably improves hiring outcomes (quality, time-to-fill, candidate experience) in their area
      calibration_question: Can they own ambiguous full-cycle recruiting end-to-end without escalating?
      mission: Lead full-cycle recruiting for a function or team, including the ambiguous parts.
      success_looks_like:
      - Decides the approach for ambiguous hiring problems and owns full-cycle recruiting for a function or team end-to-end
      - Partners with hiring managers to clarify and refine role profiles based on evidence of what's working
      - Proactively manages hiring-manager expectations and facilitates calibration across interviewers
      - Runs a consistent, respectful candidate experience from intake through offer
      - Measurably improves hiring outcomes in their area — quality, time-to-fill, or candidate experience
      - Builds fairness and accessibility into the process rather than bolting them on
      - Mentors Associate and Level I recruiters through pairing and review
      example_outcomes:
      - A function's full-cycle hiring owned end-to-end, from intake to offer, without escalating routine calls
      - An interview loop calibrated so interviewers reach consistent, defensible decisions
      - A measurable improvement in time-to-fill or qualified-candidate conversion for the area they own
      - A role profile refined with a hiring manager after early signal showed the original was off
      - A candidate-experience fix (clearer updates, faster turnarounds) that improved decline-stage feedback
    - level: Senior
      decisions_ownership: Makes consequential talent tradeoffs; owns recruiting strategy for a function or portfolio area
      consulting_scope: Reframes talent problems for leadership; aligns hiring managers and leadership on hiring strategy
      impact: Hiring outcomes improve in their area because of decisions they made, not just roles they filled
      calibration_question: Would hiring quality or pipeline health slip if they stepped away?
      mission: Own recruiting strategy for a function or portfolio area.
      success_looks_like:
      - Sets and owns recruiting strategy for a function or portfolio area
      - Makes consequential talent decisions under real constraints — moving quickly while keeping a fair, structured process, holding the hiring bar when the pipeline is thin, and deciding whether to hire now or wait
      - Reframes talent problems for leadership and aligns hiring managers and leadership on a hiring strategy
      - Improves hiring outcomes in their area because of decisions they made, not just roles they filled
      - Strengthens hiring craft in their function or portfolio area — calibration, structured evaluation, sourcing practice — alongside their own work
      - Mentors junior recruiters and coaches hiring managers
      example_outcomes:
      - A recruiting strategy for a function that improved quality of hire or pipeline health under hiring pressure
      - A consequential bar-versus-speed tradeoff held under pressure, with leadership aligned on the call
      - A calibration or structured-evaluation practice the function's hiring managers adopted
      - A persistent pipeline gap diagnosed and closed for a critical role family
      - A junior recruiter who grew measurably into independent ownership under their mentorship
    - level: Staff
      decisions_ownership: Sets talent direction across functions; owns hiring standards, processes, or workforce-planning partnership
      consulting_scope: Influences company-level talent strategy; resolves organizational blockers across functions
      impact: Multiple functions hire better because of the standards, processes, or partnerships they put in place
      calibration_question: Would cross-function hiring quality or standards slip if they stepped away?
      mission: Set talent direction across functions through shared standards, processes, and partnership.
      success_looks_like:
      - Sets talent direction across functions, not just within one
      - Identifies systemic hiring gaps no single function would see and addresses them
      - Owns hiring standards, processes, or workforce-planning partnership adopted across functions
      - Resolves cross-function talent tradeoffs and blockers no single function can clear
      - Influences company-level talent strategy with leadership
      - Mentors recruiters across the company and helps Seniors grow into cross-function thinking
      example_outcomes:
      - A structured-interview or calibration standard adopted across multiple functions that made hiring decisions more consistent and fair
      - A workforce-planning partnership with leadership and finance that staffed ahead of contract and growth demand
      - A recruiting-operations redesign (intake, stage gates, metrics) that other functions adopted and reduced dropped loops
      - A cross-function hiring conflict resolved — competing reqs, shared candidate pools — that unblocked stalled hiring
      - A reusable sourcing or screening playbook recruiters across the company adopted
    - level: Principal
      decisions_ownership: Reframes Skylight's talent approach at the company level; contributes meaningfully to Skylight growth
      consulting_scope: Trusted authority on talent; aligns leadership and represents Skylight's employer brand externally
      impact: Skylight attracts and hires materially better because of their direction
      calibration_question: Would Skylight's talent trajectory be different if they hadn't been here?
      mission: Reframe Skylight's talent approach at the company level and help Skylight grow.
      success_looks_like:
      - Reframes how Skylight thinks about talent — sourcing strategy, the talent bar, employer brand, or workforce planning — at the company level
      - Aligns leadership around hiring and people strategy and earns their buy-in
      - Guides major talent tradeoffs across the company — where to invest sourcing, how to move quickly while holding the hiring bar, how to staff for growth
      - Makes Skylight attract and hire materially better because of the direction they set
      - Contributes to the Talent Acquisition practice area through hiring craft standards, leveling, and developing Staff-level practitioners
      - Contributes to Skylight's growth by staffing the workforce that wins and delivers work, and represents Skylight's employer brand externally
      example_outcomes:
      - A company-level talent strategy leadership adopted that changed how Skylight sources, evaluates, or staffs for growth
      - An employer-brand or external-presence effort that measurably strengthened the inbound pipeline
      - A workforce-planning approach that let Skylight take on new contracts or scope it otherwise couldn't have staffed
      - A hiring-bar or talent craft standard adopted across Skylight that raised the quality and fairness of hiring
      - A Staff-level recruiter developed into a broader leadership role through sustained mentorship
  - id: people-operations
    name: People Operations
    pathway_status: ported
    role_count: 2
    public_headline: Find out how we support people through their whole time at Skylight, and the skills you need at each level.
    mission: People Operations practitioners make working at Skylight run smoothly, from the day someone accepts an offer to the day they leave. They administer compensation, benefits, leave, and performance cycles. They keep employee records accurate and manage the compliance obligations that come with being a federal contractor. They make sure every process works well for the people going through it, and that Skylight's policies are applied fairly and consistently to everyone.
    applies_levels:
    - Associate
    - I
    - II
    - Senior
    - Staff
    - Principal
    core_craft:
    - area: Employee lifecycle operations
      description: Running onboarding, role changes, and offboarding from start to finish, including the paperwork, system updates, and handoffs, so every part of a person's employment is recorded completely
    - area: Performance and development cycles
      description: Running the review cycle, including the timeline, forms, reminders, completion tracking, and calibration meetings, and handling each rating with care because it becomes part of a person's record
    - area: Compensation and benefits administration
      description: Administering pay changes, benefits enrollment, and leave according to Skylight's policies, including checking a proposed pay change against the salary band before it goes forward
    - area: HR compliance and recordkeeping
      description: Maintaining the records Skylight must keep as a federal contractor, such as I-9, EEO, OFCCP (Office of Federal Contract Compliance Programs), leave, and classification records, and knowing which have deadlines and how long each must be kept
    - area: People systems and data
      description: 'Working confidently in the HRIS and related tools: setting up workflows, fixing errors where they start, and knowing which other systems and reports each field affects'
    - area: Employee experience and engagement
      description: Making processes clear and respectful for the people going through them, and improving their experience while keeping the safeguards each process needs
    levels:
    - level: Associate
      decisions_ownership: Executes defined people-operations tasks with guidance
      consulting_scope: Answers routine employee questions with guidance; escalates anything sensitive
      impact: Completes people-operations work reliably with little rework
      calibration_question: Can they process new hires, role changes, departures, and records accurately with support?
      mission: Develop foundational people-operations skills while supporting the function.
      success_looks_like:
      - Processes new hires, role changes, and departures accurately and on time
      - Keeps employee records accurate and fixes errors where they start
      - Answers routine employee questions and escalates sensitive ones without hesitating
      - Learns which records are legally required, and why
      example_outcomes: []
    - level: I
      decisions_ownership: Owns a recurring people-operations process end to end (onboarding, benefits enrollment, records)
      consulting_scope: Handles employee questions independently; knows what to route and to whom
      impact: The process they own runs correctly without close oversight
      calibration_question: Can they own a recurring process without close oversight, and send what is not theirs to the right person?
      mission: Own a recurring people-operations process end to end.
      success_looks_like:
      - Runs onboarding, benefits enrollment, or records maintenance without oversight
      - Knows what is theirs to resolve and what must be routed
      - Notices when a process step no longer matches reality and says so
      example_outcomes: []
    - level: II
      decisions_ownership: Owns a company-wide cycle that takes a lot of coordination, such as performance reviews or open enrollment
      consulting_scope: Coaches managers through their part of a cycle; explains why a rule exists
      impact: A company-wide cycle finishes on time, and managers can complete their part on their own
      calibration_question: Can they run a company-wide cycle and get managers to complete it properly?
      mission: Run a company-wide cycle and see it through to full completion.
      success_looks_like:
      - Operates a performance or enrollment cycle across the whole company, on time
      - Helps managers understand and complete their part of the cycle
      - Explains the reasons behind rules so people understand them
      example_outcomes: []
    - level: Senior
      decisions_ownership: Owns an area (compensation administration, compliance, or people systems), including its checks and safeguards
      consulting_scope: Advises leaders on the options in their area and what each would mean, not only on process
      impact: 'Their area can be relied on: records are accurate, legal requirements are met, and exceptions are documented'
      calibration_question: Do leaders rely on their judgment about their area?
      mission: Own an area of people operations, including the checks and safeguards that keep it accurate.
      success_looks_like:
      - The records in their area are accurate and complete, and hold up in an audit
      - Leaders rely on their judgment about their area
      - Checks proposals against policy early, so any issue is resolved before a commitment is made
      example_outcomes: []
    - level: Staff
      decisions_ownership: Owns how people processes across the function are designed, not only how they run
      consulting_scope: Partners with function heads on process and policy changes before decisions are final
      impact: Processes get simpler or more reliable while keeping the safeguards they exist to provide
      calibration_question: Have they changed how a process works, and can they show what improved?
      mission: Change how people processes across the function work, not only run them.
      success_looks_like:
      - Has made processes across the function simpler or more reliable and can show what improved
      - Works with function heads on changes before decisions are final
      - Can tell which parts of a process are essential and which are there out of habit
      example_outcomes: []
    - level: Principal
      decisions_ownership: Decides with the executive team what people operations should accomplish, and where the risks are
      consulting_scope: A trusted advisor to the executive team on how people operations is set up and where its risks are
      impact: Skylight's people operations keep working well through growth, audits, and change
      calibration_question: Would the executive team change a plan based on their advice about people operations risks?
      mission: Decide with the executive team what people operations should accomplish, including where its risks are.
      success_looks_like:
      - Skylight's people operations keep working well through growth, audits, and change
      - The executive team relies on their advice about people operations risks when making plans
      - Raises risks early, with options for handling them
      example_outcomes: []
