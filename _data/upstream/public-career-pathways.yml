      - Makes consequential scope, time, and capacity tradeoffs under real constraints
      - Connects delivery work to tangible client and mission outcomes
      - Builds durable trust with senior stakeholders and resets expectations early when commitments are at risk
      - Defines what healthy delivery looks like and intervenes early when indicators slip
      - Manages deliverables, budget, and staffing against contract reality
      - Mentors analysts and less experienced engagement managers on the engagement
      example_outcomes:
      - A program kept on track through a scope or staffing shock because risk was surfaced and expectations reset early
      - A delivery outcome the client could point to — something that changed for the program, not just milestones met
      - A team-health intervention that addressed burnout or a quality spike before it reached the client
      - A staffing transition handled with discretion that preserved client trust and team continuity
    - level: Staff
