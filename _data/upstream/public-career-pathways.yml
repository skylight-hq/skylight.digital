      - Mentors engagement managers and analysts across engagements
      - Strengthens cross-team delivery decision-making
      example_outcomes:
      - A delivery playbook or risk-management practice adopted across multiple engagements
      - A systemic delivery risk spotted across engagements and addressed before it spread
      - A staffing or capacity model that improved predictability across a portfolio
      - A contested cross-engagement tradeoff resolved with a defensible rationale
    - level: Principal
      decisions_ownership: Reframes delivery problems at the mission level and influences how the client runs its programs; contributes meaningfully to Skylight's growth
      consulting_scope: Trusted authority for client leadership on delivery and program strategy; represents Skylight externally in the delivery or client domain
      impact: The client adopts a different approach to running its programs because of their work; helps open new opportunities for Skylight
      calibration_question: Would the client's program-delivery approach or Skylight's growth trajectory in delivery be different if they hadn't been here?
      mission: Shape delivery strategy across a portfolio or mission area.
      success_looks_like:
      - Reframes delivery problems at the mission level and influences how the client runs its programs
      - Identifies major opportunities to improve program delivery
      - Aligns client leadership around delivery outcomes and sustainable practices
      - Guides major tradeoffs across programs (sequencing, staffing, delivery models)
      - Contributes to Skylight's Delivery Management practice area through hiring, leveling, and craft standards
      - Contributes to Skylight's growth through proposals, expanded scope, or new opportunities
      example_outcomes:
      - A portfolio-level delivery approach the client adopted to run its programs differently
      - A program turnaround that restored client trust and put delivery on a sustainable footing
      - A delivery and risk standard adopted across engagements
      - New or expanded scope opened through a credible delivery approach in a proposal
