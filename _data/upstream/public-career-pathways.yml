    - area: Organizational assessment
      description: Diagnosing how an agency buys technology and services today — its acquisition practices, the contract vehicles it relies on, the vendor market it draws from, and the capacity of its program and contracting staff
    - area: Strategy and roadmapping
      description: Translating that read into an acquisition strategy and a sequenced roadmap for what the agency buys, when, and how — and revisiting both as the agency learns
    - area: Acquisition and procurement craft
      description: Shaping market research, acquisition vehicles, statements of work, and evaluation approaches that produce modern digital outcomes
    - area: Stakeholder communication and influence
      description: Earning trust with senior leaders and communicating clearly across audiences — from program and contracting staff to executives to oversight bodies
    levels:
    - level: Associate
