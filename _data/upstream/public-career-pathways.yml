  - id: contracts
    name: Contracts
    pathway_status: ported
    role_count: 2
    public_headline: Find out how we write and manage the agreements behind our work, and the skills you need at each level.
    mission: Contracts practitioners own the agreements that make Skylight's delivery executable and keep it compliant. They draft, review, and negotiate nondisclosure agreements (NDAs), teaming agreements, subcontracts, and prime contracts; track obligations through performance; and surface contractual risk early so terms fit the work being delivered. They translate the Federal Acquisition Regulation (FAR), its defense supplement (DFARS), and contract vehicle requirements into practical controls and plain-language guidance, protecting Skylight and its clients while keeping the work moving.
    applies_levels:
    - Associate
    - I
    - II
    - Senior
    - Staff
    - Principal
    core_craft:
    - area: Contract drafting and negotiation
      description: Drafting, reviewing, and negotiating NDAs, teaming agreements, subcontracts, contractor teaming arrangements (CTAs), and prime contracts within assigned authority, so terms are precise, defensible, and fit the work being delivered
    - area: Regulatory and contract-vehicle fluency
      description: Working knowledge of FAR (and DFARS where applicable) and government-wide vehicles (e.g., the General Services Administration's Multiple Award Schedule, GSA MAS), and the ability to translate compliance obligations into practical, day-to-day contract handling
    - area: Portfolio and documentation discipline
      description: Maintaining an organized, current record of agreements and obligations, including version control, clause libraries, obligation trackers, and renewal and modification dates, with clear owners and regular reviews
    - area: Risk identification and mitigation
      description: Spotting risky clauses early — liability, IP, term and termination, audit rights, flow-downs, data and security — and escalating them with the context, tradeoffs, and options needed to decide
    - area: Compliance monitoring during performance
      description: Tracking obligations through the life of a contract and making sure delivery teams understand what must be done and when, so every obligation is met on time
    levels:
    - level: Associate
      decisions_ownership: Executes defined contract-administration tasks with guidance
      consulting_scope: Responds to internal and client-contract requests with guidance; contributes to contract documents
      impact: Completes contract-administration work reliably with minimal rework
