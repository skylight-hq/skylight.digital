      - Owns the domain strategy for a product, program, or engagement of meaningful scope and complexity
      - Sets the direction for how policy, practice, and program reality should shape the work; adjusts as conditions change
      - Makes consequential tradeoff calls on scope, sequencing, and how the work should reflect domain realities
      - Acts as a trusted advisor to senior domain stakeholders — federal program leaders, agency executives, STLT or jurisdictional counterparts, oversight bodies — and reframes problems for them
      - Runs the full domain conversation with the client for their product or program without senior backup
      - Anticipates policy, political, or jurisdictional risks before they hit the team
      - Builds alignment across product, design, engineering, data, and the client around a shared understanding of the domain
      - Mentors junior and mid-level practitioners on the team through working sessions and direct collaboration
      - Strengthens the team's domain judgment alongside their own work
      - Contributes to business development on the engagement — recompetes, scope expansions, or proposal input where domain expertise is the differentiator
      example_outcomes:
      - A product or program that delivered against a hard policy or rule-making deadline because the Senior anticipated the change and rebaselined the team's plan early
      - A domain strategy that aligned previously competing stakeholder groups (for example, federal and STLT, or central and field, or program and oversight) around a single direction
      - A redesigned workflow adopted across multiple jurisdictions or program offices after evidence of impact in a first one
      - A renewed or expanded engagement grounded in domain credibility the client trusts
      - A first-time domain lead on the team who's now running their own practice area
      - A reusable framework or playbook that other Skylight engagements in the domain started borrowing from
    - level: Staff
      decisions_ownership: Sets domain direction across their whole operating context — the workstreams, engagements, or programs in it — and owns the systems and standards it runs on, such as workflow standards, jurisdictional playbooks, and cross-program decision records
      consulting_scope: Gets teams across the operating context pulling in the same domain direction; clears organizational and policy blockers no single team can clear
      impact: The whole operating context produces better domain-aligned work because of the standards, playbooks, or direction they put in place, and it travels to other engagements and teams
      calibration_question: If they stepped away, would the operating context lose domain direction, not just a strong contributor?
      mission: Improve domain outcomes across multiple engagements, programs, or jurisdictions.
      success_looks_like:
      - Sets domain direction across multiple workstreams, engagements, or program areas
      - Identifies systemic issues across engagements — common workflow blockers, recurring policy interpretations, jurisdictional drift — that no single team would see
      - Establishes shared practices — workflow standards, jurisdictional playbooks, decision records, briefing templates — that other engagements adopt
      - Resolves cross-engagement tradeoffs around scope, sequencing, or how to navigate policy change
      - Mentors practitioners across engagements — and where Skylight has multiple domains, bridges across them to share approaches and develop people
      - Influences program-level strategy with senior client stakeholders across more than one program area
      - Strengthens cross-team decision-making on domain questions
      - Contributes to Skylight's growth through proposal contributions, scope expansions, or new opportunity development in their domain or in adjacent ones
      example_outcomes:
      - A domain playbook or workflow standard adopted across multiple engagements that reduced ramp-up time and improved consistency
      - A cross-engagement synthesis that revealed a shared domain challenge and shifted how Skylight approaches that area of the mission
      - A jurisdictional or program variation framework that helped multiple teams handle differences without re-doing the analysis each time
      - A new contract or scope expansion that came directly from domain credibility they built
      - A Senior practitioner on another engagement who's now operating at their level because of their coaching
      - A bridge to a new domain — a hire, a framework, or a body of work that established a second specialty within the practice area (where applicable)
    - level: Principal
      decisions_ownership: Decides, with client leadership, how the domain should shape part of the mission — cutting through the noise to diagnose the root problem; shares ownership of the health of Skylight's Domain Expertise practice area
      consulting_scope: 'A trusted advisor up to client leadership: aligns stakeholders across programs on a domain direction and earns their buy-in; a recognized voice in their domain through speaking, publishing, or community leadership'
      impact: Client leadership approaches part of its mission differently because of their work, and Skylight's domain capability is stronger for it — new opportunities open, and the practice area and its people grow
      calibration_question: If they'd never been here, would the mission this engagement serves be on a different path?
      mission: Shape how clients approach their mission in the domain, and help open new opportunities for Skylight.
      success_looks_like:
      - Reframes problems and influences how the client thinks about part of its mission
      - Aligns client leadership around a domain direction that spans multiple programs
      - Guides major tradeoffs on portfolio investment, program design, or policy implementation
      - Acts as an external authority in the domain — through speaking, writing, recognized expertise, or domain community leadership
      - Contributes to Skylight's Domain Expertise practice area through hiring, leveling, craft standards, and supporting practitioners across the practice area
      - Shapes how Skylight develops domain expertise as a capability — including identifying which new domains to invest in and how to bring senior domain experts onto delivery teams effectively
      - Contributes to Skylight's growth through proposal contributions, expanded scope with existing clients, or new client opportunities where deep domain expertise is the differentiator
      - Improves organizational learning from how domain strategy work runs across engagements
      example_outcomes:
      - A program reorganized around a framing the Principal brought — changing how the client approaches part of its mission across multiple programs or jurisdictions
      - A new contract won at an existing client because of domain credibility built across prior engagements
      - A proposal effort they led or contributed to that brought in new mission work for Skylight in their domain or in an adjacent one
      - A domain approach adopted across a client portfolio that materially changed how the agency does the work
      - A change across the whole practice area at Skylight — a hiring rubric for domain experts, a model for embedding domain strategists on delivery teams, a leveling standard — that raised the bar for how Skylight develops and deploys domain expertise
      - An external presence (talks, publications, recognized expertise in the domain community) that brought new opportunities to Skylight
