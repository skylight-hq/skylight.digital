    public_headline: Find out how we decide what to build next and why, and the skills you need at each level.
    mission: Product Management practitioners decide what a team should build next and why. They turn user needs, mission goals, and business constraints into a clear product strategy, then guide cross-functional teams to deliver it. They frame problems before reaching for solutions, prioritize outcomes over feature lists, and keep delivery moving toward measurable results for the people a service serves.
    applies_levels:
    - Associate
    - I
    - II
    - Senior
    - Staff
    - Principal
    core_craft:
    - area: Problem framing and product strategy
      description: Defining the problem before the solution, and setting product direction, success measures, and a roadmap
    - area: Prioritization and delivery
      description: Breaking work into shippable value, maintaining a prioritized backlog, and keeping the team delivering
    - area: User and evidence grounding
      description: Grounding product decisions in user research, usage data, and discovery
    - area: Cross-functional team leadership
      description: Leading a team of researchers, designers, and engineers without authority over them, and setting the team's working rhythm and tending to its health and practices
    levels:
    - level: Associate
      decisions_ownership: Executes defined product tasks, with guidance — for example, writing user stories, prepping ceremonies, and maintaining the backlog
      consulting_scope: Responds to stakeholder requests with guidance; contributes to shared product artifacts
      impact: Completes product tasks reliably with little rework
      calibration_question: Can they deliver defined product tasks reliably, with guidance?
      mission: Develop foundational product skills while supporting a delivery team.
      success_looks_like:
      - Maintains a clear, current backlog and writes clear, actionable user stories
      - Preps and supports team ceremonies with reliable follow-through
      - Grounds work in user value, participating in discovery and research sessions
      - Communicates progress and priorities clearly to teammates
      - Builds working relationships across disciplines and begins to understand how stakeholders are engaged
      example_outcomes:
      - A backlog kept refined and current so iteration planning runs smoothly
      - User stories that pass into development without major rework
      - Interview notes synthesized into themes that help the team prioritize
      - A first stakeholder demo delivered clearly and on schedule
    - level: I
      decisions_ownership: Decides the approach for well-scoped product work; owns a defined feature or backlog area within a larger product or initiative
      consulting_scope: Builds solid working relationships with direct counterparts; communicates progress and priorities clearly
      impact: The work they own is done well and on pace
      calibration_question: Can they choose the right approach for well-scoped product work without close oversight?
      mission: Own a defined feature or backlog area and run it well.
      success_looks_like:
      - Decides the approach for well-scoped product work and owns a feature or backlog area
      - Frames problems around user and mission outcomes, not just feature requests
      - Maintains a prioritized backlog and defends prioritization rationale to the team
      - Translates research and usage data into concrete product decisions
      - Communicates progress, risks, and priorities clearly to direct counterparts
      - Identifies and addresses team friction points that slow down delivery
      example_outcomes:
      - A feature shipped to production that improves a user workflow
      - A reprioritized backlog that moves the team toward higher-value work
      - Research insights translated into backlog changes the team acts on
      - A clearer release plan that reduces churn during delivery
      - A risk surfaced early enough that the team adjusted course without missing a milestone
    - level: II
      decisions_ownership: Decides the approach for ambiguous product problems; owns a feature, workstream, or capability end to end
      consulting_scope: Proactively manages stakeholder expectations; facilitates planning, syncs, and reviews; produces client-ready product artifacts that land without heavy revision
      impact: The product or capability they own delivers its intended outcome — such as a workflow that ships and improves task completion
      calibration_question: Can they own ambiguous product work end to end and make the calls without escalating?
      mission: Own a product or major capability end-to-end.
      success_looks_like:
      - Decides the approach for ambiguous product problems and owns a product or capability end-to-end
      - Defines a product strategy with clear outcomes, success measures, and a roadmap
      - Sequences delivery so the riskiest assumptions get tested first
      - Produces client-ready artifacts — roadmaps, prioritization rationale, and release plans — that land without heavy revision
      - Partners with research, design, and engineering to shape solutions, not just hand off requirements
      - Evaluates whether shipped work actually improved the outcome
      example_outcomes:
      - A capability shipped that delivers the improvement it was scoped to deliver — for example, higher task completion in a benefits or enrollment workflow
      - An MVP defined and launched to users that validated a direction before heavy investment
      - A roadmap that realigned the team's priorities toward a higher-impact part of the user journey
      - Prioritization decisions defended to a skeptical agency stakeholder that held up under pressure
      - A discovery effort that retired a planned feature the evidence didn't support
    - level: Senior
      decisions_ownership: Makes the consequential product tradeoff calls; owns product strategy for a core area their operating context depends on
      consulting_scope: Navigates competing priorities and turns messy situations in their area into clear choices for senior stakeholders; influences how the team approaches product questions
      impact: Improves product outcomes in their area because of decisions they made, not just the work they delivered
      calibration_question: If they stepped away, would the team lose product judgment, not just capacity?
      mission: Own product strategy for a core area that others depend on.
      success_looks_like:
      - Sets product direction and strategy for a core area that other work depends on
      - Makes consequential tradeoff decisions under real constraints — scope, timeline, technical debt, client or stakeholder pressure
      - Connects user insight and mission goals into a coherent product strategy
      - Aligns the delivery team and client stakeholders around prioritized outcomes
      - Reframes problems for senior stakeholders and navigates competing priorities
      - Leads the team through discovery, delivery, and learning across iterations
      - Mentors junior and mid-level product managers through planning, reviews, and direct collaboration
      - Strengthens the team's product judgment alongside their own work
      example_outcomes:
      - A reprioritized roadmap for an eligibility or enrollment program that shifted investment toward the highest-impact work
      - A consequential build-versus-defer decision that held up under client and delivery pressure
      - A product strategy that aligned three stakeholder groups around a single prioritized backlog
      - Improved task completion or reduced support burden after a Senior-led capability redesign
      - Prioritization rituals or discovery practices the team adopted and kept using
    - level: Staff
      decisions_ownership: Sets product direction for their whole operating context; owns the operating models, prioritization frameworks, and standards it runs on
      consulting_scope: Gets teams across their operating context pulling in the same direction on product priorities; clears blockers no single team can resolve
      impact: Other product workstreams — and teams beyond their own — move faster or improve in quality because of the operating models, standards, or direction they put in place
      calibration_question: If they stepped away, would the operating context lose direction, not just a strong contributor?
