  - id: operations
    name: Operations
    pathway_status: ported
    role_count: 3
    public_headline: Find out how we keep Skylight running day to day, and the skills you need at each level.
    mission: 'Operations practitioners keep Skylight running smoothly. They coordinate the schedules, logistics, and communications leaders depend on, and they run and improve the internal operations and processes the company relies on day to day — turning recurring work into systems that stay reliable, traceable, and easy for the next person to pick up. Their reach is internal: when operations run well, every other function spends less time on friction and more on its mission.'
    applies_levels:
    - Coordinator
    - Associate
    - I
    - II
    - Senior
    - Staff
    - Principal
    core_craft:
    - area: Execution and follow-through
      description: Seeing day-to-day operational tasks and projects through to completion, following up consistently, and tracking upcoming work so commitments are met
    - area: Coordination and logistics
      description: Organizing schedules, meetings, travel, events, and cross-stakeholder work so people's time is protected and the right people act at the right time
    - area: Documentation and records
      description: Keeping records, trackers, notes, and system data accurate, current, and well-organized, with careful quality checks so others can rely on them
    - area: Operational visibility and risk
      description: Keeping an accurate view of how operations are going — spending against budget, staffing changes, compliance status, reporting accuracy — and raising risks early with the context to act on them
    - area: Process improvement
      description: Identifying friction in how operational work gets done and proposing practical improvements that reduce rework and ambiguity without adding bureaucracy
    - area: Governance and discretion
      description: Following change-control, governance, and documentation standards so operational changes are recorded and can be reviewed, and handling sensitive information confidentially, with access limited to those who need it
    levels:
    - level: Coordinator
      decisions_ownership: Carries out routine operational and coordination tasks under direction; follows established processes
      consulting_scope: Handles routine scheduling, logistics, and communications; escalates anything non-routine
      impact: Keeps recurring operations and logistics running reliably
      calibration_question: Can they reliably execute routine operational tasks and coordination with close direction?
      mission: Keep recurring operations, scheduling, and logistics running reliably under direction.
      success_looks_like:
      - Executes routine coordination, scheduling, and logistics with reliable follow-through
      - Communicates clearly and escalates non-routine items appropriately
      - Keeps calendars, trackers, and logs current and accurate
      - Handles sensitive information with discretion and limits access to those who need it
      example_outcomes:
      - A leader's calendar and recurring commitments kept current so nothing slips
      - Travel or meeting logistics coordinated cleanly with a low error rate
      - A shared tracker kept up to date so the team works from accurate information
    - level: Associate
      decisions_ownership: Executes defined operational tasks with guidance
      consulting_scope: Responds to internal requests with guidance; contributes to operational documents and trackers
      impact: Completes operational work reliably with minimal rework
      calibration_question: Can they reliably complete assigned operational tasks with minimal rework?
      mission: Develop foundational operational skills while supporting the function.
      success_looks_like:
      - Executes defined operational tasks with reliable follow-through and little rework
      - Produces clear operational documentation and keeps trackers accurate
      - Implements feedback without repeated rework
      - Collaborates effectively with internal stakeholders and asks for help at the right moments
      example_outcomes:
      - An operational task or recurring process completed cleanly without follow-up corrections
      - A tracker or document built and maintained so others can rely on it
      - A logistics or coordination request handled end-to-end with guidance
    - level: I
      decisions_ownership: Decides approach for well-scoped operational work; owns a recurring process or coordination area
      consulting_scope: Builds solid working relationships with internal counterparts; communicates progress and risks clearly
      impact: The operations they own run reliably and on time
      calibration_question: Can they be trusted to own a well-scoped operational area without close oversight?
      mission: Own a well-scoped recurring process or coordination area.
      success_looks_like:
      - Decides the approach for well-scoped operational work and owns a recurring process or coordination area
      - Keeps the operations they own running reliably and on time
      - Keeps documentation and systems clean enough that others trust them as the source of truth
      - Communicates progress, blockers, and risks clearly to internal counterparts
      - Surfaces basic operational risks early with enough context to act on
      example_outcomes:
      - A recurring process owned end-to-end with fewer errors or less rework than before
      - A tracker or workflow tightened so other teams can use the data with confidence
      - An operational risk flagged early enough that a stakeholder adjusted without disruption
    - level: II
      decisions_ownership: Decides approach for ambiguous operational problems; owns an operational process or area end-to-end
      consulting_scope: Proactively manages internal-stakeholder expectations; produces clear operational documents that stakeholders can use without heavy revision
      impact: Their work measurably improves an operational process they own
      calibration_question: Can they own ambiguous operational work end-to-end without escalating?
      mission: Lead an operational process or area end-to-end, including the ambiguous parts.
      success_looks_like:
      - Decides the approach for ambiguous operational problems and owns a process or area end-to-end
      - Makes sound tradeoff decisions on approach, scope, and sequencing without escalating routine choices
      - Produces operational documents that stakeholders can use without heavy revision
      - Measurably improves an operational process they own
      - Builds visibility, QA, and traceability into the work rather than bolting them on
      - Mentors Coordinators and Associates through pairing and review
      example_outcomes:
