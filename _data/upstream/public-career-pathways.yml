      - Builds Skylight's external reputation and internal capability in the practice area
      - Mentors Staff-level Practice Leads and shapes the practice area itself
      - Aligns the practice area's direction with company strategy, growth, and financial realities at the leadership table
      - Brings credibility in the practice area into proposals, solution shaping, and portfolio growth
